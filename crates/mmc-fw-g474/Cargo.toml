[package]
name = "mmc-fw-g474"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "STM32G474RE + STSPIN830 shield: the MotorBoard under the mmc-drive application"

# Detached from the root workspace: always builds for thumbv7em-none-eabihf
# (see .cargo/config.toml).
[workspace]

[features]
# Every subsystem (512 KB of flash). Each passes through to mmc-drive, so
# `--no-default-features --features …` builds any set (tools/feature_sizes.sh).
default = ["sixstep", "estim", "cogging", "hall-pos", "telemetry", "burst"]
sixstep = ["mmc-drive/sixstep"]
estim = ["mmc-drive/estim"]
cogging = ["mmc-drive/cogging"]
hall-pos = ["mmc-drive/hall-pos"]
hfi-shadow = ["mmc-drive/hfi-shadow"]
telemetry = ["mmc-drive/telemetry"]
burst = ["mmc-drive/burst"]
fixq = ["mmc-drive/fixq"]

[dependencies]
mmc-core = { path = "../mmc-core" }
mmc-drive = { path = "../mmc-drive", default-features = false }
mmc-hal = { path = "../mmc-hal" }
mmc-proto = { path = "../mmc-proto" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = ["stm32g474re", "memory-x", "rt", "time-driver-any", "unstable-pac", "dual-bank"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 2
