[package]
name = "mmc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable no_std control library for the modular motor controller"

[features]
default = ["foc", "sixstep"]
# Field-oriented control: transforms, SVPWM, dq current loop, flux observer and
# the sensorless startup that sits on top of it.
foc = []
# Six-step trapezoidal commutation with back-EMF zero-cross sensing.
sixstep = []

[dependencies]
libm.workspace = true
