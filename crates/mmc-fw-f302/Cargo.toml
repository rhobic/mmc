[package]
name = "mmc-fw-f302"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "STM32F302R8 + L6230 three-shunt shield: the MotorBoard under the mmc-drive application"

# Detached from the root workspace: always builds for thumbv7em-none-eabihf
# (see .cargo/config.toml).
[workspace]

[features]
# Subsystems this bench builds (62 KB of flash): FOC, sensorless + HFI and
# hall FOC/position. Six-step, the online R/ψ estimator and the cogging
# feed-forward are left out (session 42); add them to `default` if the bench
# needs them, then watch tools/fw_size.sh. Each passes through to mmc-drive,
# so `--no-default-features --features …` builds any set (tools/feature_sizes.sh).
default = ["hall-pos"]
sixstep = ["mmc-drive/sixstep"]
estim = ["mmc-drive/estim"]
cogging = ["mmc-drive/cogging"]
hall-pos = ["mmc-drive/hall-pos"]
hfi-shadow = ["mmc-drive/hfi-shadow"]
# Run HFI sensorless on the integer path (mmc_core::fixq).
fixq = ["mmc-drive/fixq"]

[dependencies]
mmc-core = { path = "../mmc-core" }
mmc-drive = { path = "../mmc-drive", default-features = false, features = ["link"] }
mmc-hal = { path = "../mmc-hal" }
mmc-proto = { path = "../mmc-proto" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# No `memory-x`: memory.x here reserves the last flash page for parameters.
# TIM15 keeps the time driver off TIM1 (PWM) and TIM2 (the hall timer).
embassy-stm32 = { version = "0.6.0", features = ["stm32f302r8", "rt", "time-driver-tim15", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 2
debug = 2

# Size over speed for what runs outside the control interrupt: boot, the
# executor, the serial link and the protocol codec (~420 bytes). The control
# tick is mmc-drive's `Engine::tick`, instantiated in this crate (opt-level 2
# above), calling into mmc-core and libm, so those stay at 2. embassy-stm32
# does too: its GPIO and timer accessors inline into the board's
# `MotorBoard` impl, and at "s" they shifted the tick's inlining (`Pi::update`
# and `TrapRef::update` became calls). With this set, every function the ADC1
# handler reaches is the same size as in an all-opt-level-2 build.
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.mmc-core]
opt-level = 2
[profile.release.package.mmc-drive]
opt-level = 2
[profile.release.package.libm]
opt-level = 2
[profile.release.package.embassy-stm32]
opt-level = 2
