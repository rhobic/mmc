[package]
name = "mmc-fw-f302"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "STM32F302R8 + L6230 three-shunt shield: the MotorBoard under the mmc-drive application"

# Detached from the root workspace: always builds for thumbv7em-none-eabihf
# (see .cargo/config.toml).
[workspace]

[dependencies]
mmc-core = { path = "../mmc-core" }
mmc-drive = { path = "../mmc-drive", features = ["link"] }
mmc-hal = { path = "../mmc-hal" }
mmc-proto = { path = "../mmc-proto" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# No `memory-x`: memory.x here reserves the last flash page for parameters.
# TIM15 keeps the time driver off TIM1 (PWM) and TIM2 (the hall timer).
embassy-stm32 = { version = "0.6.0", features = ["stm32f302r8", "rt", "time-driver-tim15", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 2
debug = 2
