[package]
name = "mmc-drive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Board-agnostic motor-drive application: drive state machine, protocol handling, probes and telemetry, run on any mmc-hal MotorBoard"

[features]
# Control subsystems, each a build option: a board enables what its hardware
# and its application need (all on by default; the sim tests and the G474
# build everything). A drive mode that is not built in is NAKed at SetDrive,
# as a board without halls refuses the hall modes; the parameter table is the
# same in every build, so stored tables and the host tools are unaffected.
default = ["sixstep", "estim", "cogging", "hall-pos", "telemetry", "burst"]
# Six-step: forced, hall and sensorless (back-EMF zero crossings, needs the
# terminal dividers), 120/180° conduction, the FOC→six-step live handover.
sixstep = []
# Online R/ψ estimator in the closed-loop FOC modes, and its i_d dither.
estim = []
# Position-torque (cogging) feed-forward and pole-pair identification, in
# hall FOC (needs halls).
cogging = []
# HallPosition drive: trapezoidal reference, position PID, hall tracker.
hall-pos = []
# Host-link scaling (session 44). `telemetry`: the streaming channels — the
# control tick's per-period snapshot and the link's frames (Stream,
# SetTelemetry). Each 29-channel frame costs ~10–12 k cycles to snapshot and
# encode on the F302, ~8.6 % of its CPU at 500 frames/s. `burst`: the
# full-rate test recordings (RunTest R/L, saliency and HFI sweeps, ReadBurst)
# and the probe drive; the profiler needs it, and the burst buffer is the
# board's biggest RAM user. Without them the link still takes commands,
# parameters and saves; their messages are NAKed.
telemetry = []
burst = []
# Diagnostic, off by default: in the hall modes, run the HFI tracker in
# shadow (`hfi_v` > 0) and score it against the halls on `theta_err`.
# ~1 160 cycles a tick on the F302.
hfi-shadow = []
# The serial host link as async loops over embedded-io-async, shared by
# every board crate, so the firmware glue is two lines per task.
link = ["dep:embedded-io-async", "dep:embassy-sync", "dep:embassy-time", "dep:embassy-futures"]
# The HFI sensorless drive on the integer path (`mmc_core::fixq`) instead
# of the float one: the proof that it fits an FPU-less MCU, run on a board
# that has one. Times the integer step into `FIXQ_CYCLES_MAX`/`_AVG`.
fixq = []

[dependencies]
mmc-core.workspace = true
mmc-hal.workspace = true
mmc-proto.workspace = true
embedded-io-async = { version = "0.7", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-futures = { version = "0.1.2", optional = true }

[dev-dependencies]
mmc-sim.workspace = true
