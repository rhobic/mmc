[workspace]
resolver = "3"
members = [
    "crates/mmc-core",
    "crates/mmc-hal",
    "crates/mmc-proto",
    "crates/mmc-sim",
    "crates/mmc-host",
]
# Firmware binaries build for their MCU target only (own .cargo/config.toml),
# so they stay out of the host workspace.
exclude = ["crates/mmc-fw-g0b1"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mmc-core = { path = "crates/mmc-core" }
mmc-hal = { path = "crates/mmc-hal" }
mmc-proto = { path = "crates/mmc-proto" }
mmc-sim = { path = "crates/mmc-sim" }
libm = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
lto = true
codegen-units = 1
